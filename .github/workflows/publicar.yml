name: publicar

# Trusted Publishing (OIDC): nenhum token no repositório. Cada índice precisa de um publisher cadastrado
# apontando para este repo, este arquivo (publicar.yml) e o environment do job (testpypi / pypi).
#   manual (workflow_dispatch)  → TestPyPI
#   tag v*                      → PyPI, só se a versão da tag bater com a do pyproject
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Tag bate com a versão do pacote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versao=$(uv version --short)
          [[ "${GITHUB_REF_NAME#v}" == "$versao" ]] || { echo "tag $GITHUB_REF_NAME ≠ versão $versao" >&2; exit 1; }
      - name: Build
        run: uv build
      - name: Metadados válidos para o índice
        run: uvx twine==7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/raspador-compliant/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/raspador-compliant/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
